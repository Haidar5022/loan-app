<div class="page-wrapper">
  <div class="login-card">
    
    <!-- Left Half Image Banner -->
    <div class="left-banner">
      
        <img src="images/otp1.jpg" alt="Otp-Banner" class="banner-img" />
      
    </div>

    <!-- Right Half Form Section -->
    <div class="right-form">
      <div class="form-container">
        
        <p class="instruction-text">Enter verification code sent to your registered mobile.</p>

        <!-- Account No Readonly Field -->
        <mat-form-field appearance="outline" class="custom-field">
          <mat-label>Account No *</mat-label>
          <input matInput [value]="accountNo" readonly />
        </mat-form-field>

        <!-- OTP Input Field -->
        <mat-form-field appearance="outline" class="custom-field" [class.mat-form-field-invalid]="otpError">
          <mat-label>Enter OTP *</mat-label>
          <input 
            matInput 
            type="password" 
            maxlength="6" 
            [(ngModel)]="otp" 
            placeholder="••••" 
            (keyup.enter)="onVerify()"
          />
          <mat-error *ngIf="otpError">Please enter valid OTP</mat-error>
        </mat-form-field>

        <!-- Resend OTP Timer Row -->
        <div class="resend-row">
          Didn't receive the OTP? 
          <span class="timer">({{ timerText }})</span> 
          <a href="javascript:void(0)" (click)="resendOtp()" class="resend-link">Resend OTP</a>
        </div>

        <!-- Action Buttons -->
        <button mat-raised-button color="primary" class="submit-btn" (click)="onVerify()">Submit</button>
        <button mat-stroked-button class="back-btn" (click)="goBack()">Back</button>

        <!-- Bottom Promo Card -->
        <div class="promo-card">
          <img src="images/otp2.jpg" alt="Promo" class="promo-img" />
        </div>

      </div>
    </div>

  </div>
</div>

<div class="page-wrapper">
  <div class="login-card">
    
    <!-- LEFT BANNER (Pure Image - No HTML Text Overlay Needed) -->
    <div class="left-banner">
      <img src="images/login1.jpg" alt="Login Banner" class="banner-img" />
    </div>

    <!-- RIGHT FORM SECTION -->     
    <div class="right-form">
      <div class="form-container">
        
        <div class="instruction-text">Enter your Account number to get started.</div>

        <!-- Angular Material Field -->
        <mat-form-field appearance="outline" class="custom-field">
          <mat-label>Account No *</mat-label>
          <input matInput [(ngModel)]="accountNumber" type="text" maxlength="19" />
        </mat-form-field>

        <!-- Validation Error Display -->
<div *ngIf="errorMessage" style="color: red; font-size: 12px; margin-bottom: 0px;">
  {{ errorMessage }}
</div>

        <!-- Pill Button -->
        <button mat-flat-button class="submit-btn" (click)="onContinue()">
          Continue
        </button>

        <!-- Promo Offer Card -->
        <div class="promo-card">
          <img src="images/login2.jpg" alt="Promo Offer" class="promo-img" />
         
        </div>

      </div>
    </div>

  </div>
</div>
